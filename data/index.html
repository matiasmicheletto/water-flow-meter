<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Meter</title>
<style>
  :root {
    --bg: #f6f1e8;
    --panel: rgba(255, 252, 247, 0.9);
    --ink: #17211f;
    --muted: #5c6b67;
    --accent: #0f8b6d;
    --accent-soft: rgba(15, 139, 109, 0.14);
    --line: #d8d0c4;
    --shadow: 0 18px 45px rgba(23, 33, 31, 0.12);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at top left, rgba(15, 139, 109, 0.16), transparent 28%),
      radial-gradient(circle at bottom right, rgba(198, 124, 78, 0.18), transparent 22%),
      linear-gradient(180deg, #fcf8f2 0%, var(--bg) 100%);
  }

  .shell {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 28px;
  }

  .hero {
    padding: 22px;
    border-radius: 24px;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(249, 241, 226, 0.84));
    box-shadow: var(--shadow);
    border: 1px solid rgba(255, 255, 255, 0.7);
  }

  .eyebrow {
    margin: 0 0 8px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .hero-meta {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(1, minmax(0, 1fr));
    gap: 12px;
  }

  .metric {
    padding: 14px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid rgba(23, 33, 31, 0.06);
  }

  .metric-label {
    margin: 0 0 6px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .metric-value {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .metric-unit {
    margin-left: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
  }

  .panel {
    margin-top: 18px;
    padding: 18px;
    border-radius: 24px;
    background: var(--panel);
    box-shadow: var(--shadow);
    border: 1px solid rgba(255, 255, 255, 0.7);
  }

  @supports ((-webkit-backdrop-filter: blur(8px)) or (backdrop-filter: blur(8px))) {
    .panel {
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .panel-title {
    margin: 0;
    font-size: 1rem;
  }

  .panel-copy {
    margin: 4px 0 0;
    font-size: 0.88rem;
    color: var(--muted);
  }

  .status-pill {
    padding: 8px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }

  .chart-wrap {
    position: relative;
    margin-top: 8px;
    width: 100%;
    height: 260px;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.84), rgba(246,241,232,0.94));
    border: 1px solid rgba(23, 33, 31, 0.07);
  }

  @supports (aspect-ratio: 16 / 10) {
    .chart-wrap {
      height: auto;
      min-height: 240px;
      aspect-ratio: 16 / 10;
    }
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .chart-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .chart-empty[hidden] {
    display: none;
  }

  .actions {
    display: grid;
    gap: 12px;
    margin-top: 18px;
  }

  .export-button {
    appearance: none;
    border: 0;
    border-radius: 16px;
    padding: 16px 18px;
    font: inherit;
    font-weight: 700;
    color: #f6fff9;
    background: linear-gradient(135deg, #0f8b6d, #0f6d62);
    box-shadow: 0 12px 24px rgba(15, 139, 109, 0.24);
  }

  .export-note {
    margin: 0;
    font-size: 0.88rem;
    color: var(--muted);
  }

  .file-select {
    grid-column: 1 / -1;
    font: inherit;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
  }

  @media (min-width: 700px) {
    .shell {
      padding: 28px 24px 36px;
    }

    .hero,
    .panel {
      padding: 24px;
    }

    .hero-meta {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .actions {
      grid-template-columns: auto 1fr;
      align-items: center;
    }
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">Datos de sensor | YF-S401</p>
      <div class="hero-meta">
        <article class="metric">
          <p class="metric-label">Velocidad actual</p>
          <p class="metric-value"><span id="flow-value">--</span><span class="metric-unit">rpm</span></p>
        </article>
        <article class="metric">
          <p class="metric-label">Tiempo de medición</p>
          <p class="metric-value" id="elapsed">--:--:--</p>
        </article>
        <article class="metric">
          <p class="metric-label">Revs. totales</p>
          <p class="metric-value" id="total-pulses">--</p>
        </article>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2 class="panel-title">Datos históricos</h2>
          <p class="panel-copy">(Eje X: tiempo. Eje Y: rpm.)</p>
        </div>
        <span class="status-pill" id="chart-status">Esperando inicio...</span>
      </div>
      <div class="chart-wrap">
        <canvas id="history-chart"></canvas>
        <div class="chart-empty" id="chart-empty">Midiendo datos históricos.</div>
      </div>
    </section>

    <section class="panel actions">
      <select class="file-select" id="file-select" aria-label="Archivo de registro">
        <option value="">Sesión actual</option>
      </select>
      <button class="export-button" id="export-button" type="button">Exportar datos</button>
      <p class="export-note" id="export-note">Genera y exporta al celular el registro de datos.</p>
    </section>
  </main>

  <script>
    var flowValue = document.getElementById('flow-value');
    var elapsed = document.getElementById('elapsed');
    var totalPulses = document.getElementById('total-pulses');
    var chartStatus = document.getElementById('chart-status');
    var chartEmpty = document.getElementById('chart-empty');
    var exportButton = document.getElementById('export-button');
    var exportNote = document.getElementById('export-note');
    var fileSelect = document.getElementById('file-select');
    var canvas = document.getElementById('history-chart');
    var context = canvas.getContext('2d');
    var CURRENT_POLL_MS = 1000;
    var HISTORY_POLL_MS = 1000;
    var FILES_POLL_MS = 15000;

    var lastHistoryPoints = [];
    var lastCurrent = null;
    var lastCurrentReceivedAt = 0;
    var currentOnline = false;
    var currentLogFile = '';

    function pad2(value) {
      if (value < 10) {
        return '0' + value;
      }
      return String(value);
    }

    function formatElapsed(ms) {
      var totalSeconds = Math.max(0, Math.floor(ms / 1000));
      var hours = Math.floor(totalSeconds / 3600);
      var minutes = Math.floor((totalSeconds % 3600) / 60);
      var seconds = totalSeconds % 60;
      return pad2(hours) + ':' + pad2(minutes) + ':' + pad2(seconds);
    }

    function formatNumberSI(value) {
      var abs = Math.abs(value);
      if (abs < 1000) {
        return String(value);
      }
      if (abs < 1000000) {
        return (value / 1000).toFixed(value >= 100000 ? 0 : 1) + 'k';
      }
      if (abs < 1000000000) {
        return (value / 1000000).toFixed(value >= 100000000 ? 0 : 1) + 'M';
      }
      return (value / 1000000000).toFixed(1) + 'B';
    }

    function setHidden(element, hidden) {
      if (hidden) {
        element.setAttribute('hidden', 'hidden');
      } else {
        element.removeAttribute('hidden');
      }
    }

    function getJSON(url, onSuccess, onError) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) {
          return;
        }
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            onSuccess(JSON.parse(xhr.responseText || '{}'));
          } catch (parseError) {
            onError(parseError);
          }
          return;
        }
        onError(new Error('Request failed: ' + xhr.status));
      };
      xhr.onerror = function () {
        onError(new Error('Network error'));
      };
      xhr.send();
    }

    function getBlob(url, onSuccess, onError) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'blob';
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) {
          return;
        }
        if (xhr.status >= 200 && xhr.status < 300) {
          onSuccess(xhr.response);
          return;
        }
        onError(new Error('Request failed: ' + xhr.status));
      };
      xhr.onerror = function () {
        onError(new Error('Network error'));
      };
      xhr.send();
    }

    function subsamplePoints(points, maxPoints) {
      var i;
      var result;
      var innerCount;
      var keepInner;
      var step;

      if (points.length <= maxPoints || maxPoints < 3) {
        return points;
      }

      result = [points[0]];
      innerCount = points.length - 2;
      keepInner = maxPoints - 2;
      step = Math.ceil(innerCount / keepInner);

      for (i = 1; i < points.length - 1; i += step) {
        result.push(points[i]);
      }

      result.push(points[points.length - 1]);
      return result;
    }

    function resizeCanvas() {
      var ratio = window.devicePixelRatio || 1;
      var width = canvas.clientWidth;
      var height = canvas.clientHeight;
      canvas.width = Math.floor(width * ratio);
      canvas.height = Math.floor(height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function drawAxes(padding, width, height, minTime, maxTime, maxPulse) {
      var innerHeight = height - padding.top - padding.bottom;
      var idx;
      var y;

      context.strokeStyle = 'rgba(23, 33, 31, 0.14)';
      context.lineWidth = 1;
      context.beginPath();
      for (idx = 0; idx < 4; idx += 1) {
        y = padding.top + (innerHeight / 3) * idx;
        context.moveTo(padding.left, y);
        context.lineTo(width - padding.right, y);
      }
      context.stroke();

      context.fillStyle = '#5c6b67';
      context.font = '12px IBM Plex Sans, sans-serif';
      context.textAlign = 'right';
      context.fillText('0', padding.left - 8, padding.top + innerHeight + 4);
      context.fillText(String(maxPulse), padding.left - 8, padding.top + 4);

      context.textAlign = 'left';
      context.fillText(formatElapsed(minTime), padding.left, height - 8);
      context.textAlign = 'right';
      context.fillText(formatElapsed(maxTime), width - padding.right, height - 8);

      context.save();
      context.translate(14, padding.top + innerHeight / 2);
      context.rotate(-Math.PI / 2);
      context.textAlign = 'center';
      context.fillText('rpm', 0, 0);
      context.restore();
    }

    function computeMaxPulse(points) {
      var maxPulse = 1;
      var i;
      var value;
      for (i = 0; i < points.length; i += 1) {
        value = points[i].pulses_per_minute;
        if (value > maxPulse) {
          maxPulse = value;
        }
      }
      return maxPulse;
    }

    function drawChart(points) {
      var width;
      var height;
      var maxRenderablePoints;
      var renderPoints;
      var padding;
      var innerWidth;
      var innerHeight;
      var maxPulse;
      var minTime;
      var maxTime;
      var timeRange;
      var gradient;
      var i;
      var point;
      var x;
      var y;
      var lastX;
      var statusText;

      lastHistoryPoints = points;
      resizeCanvas();
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      context.clearRect(0, 0, width, height);

      if (!points.length) {
        setHidden(chartEmpty, false);
        chartEmpty.textContent = 'Registrando datos historicos.';
        chartStatus.textContent = 'Esperando inicio';
        return;
      }

      maxRenderablePoints = Math.max(150, Math.floor(width * 0.7));
      renderPoints = subsamplePoints(points, maxRenderablePoints);

      setHidden(chartEmpty, true);
      statusText = String(points.length) + ' datos';
      if (renderPoints.length !== points.length) {
        statusText += ' (rendering ' + renderPoints.length + ')';
      }
      chartStatus.textContent = statusText;

      padding = { top: 18, right: 14, bottom: 32, left: 40 };
      innerWidth = width - padding.left - padding.right;
      innerHeight = height - padding.top - padding.bottom;
      maxPulse = computeMaxPulse(renderPoints);
      minTime = renderPoints[0].t_ms;
      maxTime = renderPoints[renderPoints.length - 1].t_ms || (minTime + 1);
      timeRange = Math.max(1, maxTime - minTime);

      drawAxes(padding, width, height, minTime, maxTime, maxPulse);

      gradient = context.createLinearGradient(0, padding.top, 0, height - padding.bottom);
      gradient.addColorStop(0, 'rgba(15, 139, 109, 0.30)');
      gradient.addColorStop(1, 'rgba(15, 139, 109, 0.02)');

      context.beginPath();
      for (i = 0; i < renderPoints.length; i += 1) {
        point = renderPoints[i];
        x = padding.left + ((point.t_ms - minTime) / timeRange) * innerWidth;
        y = padding.top + innerHeight - (point.pulses_per_minute / maxPulse) * innerHeight;
        if (i === 0) {
          context.moveTo(x, y);
        } else {
          context.lineTo(x, y);
        }
      }
      lastX = padding.left + ((renderPoints[renderPoints.length - 1].t_ms - minTime) / timeRange) * innerWidth;
      context.lineTo(lastX, padding.top + innerHeight);
      context.lineTo(padding.left, padding.top + innerHeight);
      context.closePath();
      context.fillStyle = gradient;
      context.fill();

      context.beginPath();
      for (i = 0; i < renderPoints.length; i += 1) {
        point = renderPoints[i];
        x = padding.left + ((point.t_ms - minTime) / timeRange) * innerWidth;
        y = padding.top + innerHeight - (point.pulses_per_minute / maxPulse) * innerHeight;
        if (i === 0) {
          context.moveTo(x, y);
        } else {
          context.lineTo(x, y);
        }
      }
      context.strokeStyle = '#0f8b6d';
      context.lineWidth = 3;
      context.lineJoin = 'round';
      context.lineCap = 'round';
      context.stroke();
    }

    function updateElapsedFromLastCurrent() {
      var driftMs;
      if (!lastCurrent || !currentOnline) {
        elapsed.textContent = '--:--:--';
        return;
      }

      driftMs = Date.now() - lastCurrentReceivedAt;
      elapsed.textContent = formatElapsed((lastCurrent.elapsed_ms || 0) + driftMs);
    }

    function pollCurrent() {
      getJSON('/api/current', function (current) {
        lastCurrent = current;
        lastCurrentReceivedAt = Date.now();
        currentOnline = true;
        flowValue.textContent = String(current.pulses_per_minute != null ? current.pulses_per_minute : 0);
        totalPulses.textContent = formatNumberSI(current.total_pulses != null ? current.total_pulses : 0);
        updateElapsedFromLastCurrent();
      }, function () {
        currentOnline = false;
        flowValue.textContent = '--';
        elapsed.textContent = '--:--:--';
        totalPulses.textContent = '--';
      });
    }

    var historyRequestInFlight = false;

    function pollHistory() {
      if (historyRequestInFlight) {
        return;
      }
      historyRequestInFlight = true;

      var params = fileSelect.value ? ('?file=' + encodeURIComponent(fileSelect.value)) : '';
      getJSON('/api/history' + params, function (history) {
        historyRequestInFlight = false;
        drawChart(history.points || []);
      }, function () {
        historyRequestInFlight = false;
        chartStatus.textContent = 'Connection lost';
        setHidden(chartEmpty, false);
        chartEmpty.textContent = 'Connection lost. Reconnect to reload history.';
      });
    }

    function pollFiles() {
      getJSON('/api/files', function (data) {
        var selectedValue = fileSelect.value;
        var files = data.files || [];
        var options = ['<option value="">Sesion actual</option>'];
        var i;
        var entry;
        var label;

        currentLogFile = data.current || '';

        for (i = 0; i < files.length; i += 1) {
          entry = files[i];
          label = entry.current ? (entry.name + ' (actual)') : entry.name;
          options.push('<option value="' + entry.name + '">' + label + '</option>');
        }
        fileSelect.innerHTML = options.join('');
        fileSelect.value = selectedValue;
      }, function () {
        // Keep whatever options are already shown; retry on next poll.
      });
    }

    function attemptNativeShare(blob, fileName, onShared, onFallback) {
      try {
        if (!navigator || !navigator.share || !navigator.canShare || typeof File === 'undefined') {
          onFallback();
          return;
        }

        var file = new File([blob], fileName, { type: 'text/csv' });
        if (!navigator.canShare({ files: [file] })) {
          onFallback();
          return;
        }

        navigator.share({
          files: [file],
          title: 'Flow history export',
          text: 'Pulse history from the flow meter'
        }).then(function () {
          onShared();
        }).catch(function () {
          onFallback();
        });
      } catch (e) {
        onFallback();
      }
    }

    function downloadBlob(blob, fileName) {
      var urlCreator = window.URL || window.webkitURL;
      if (!urlCreator || !urlCreator.createObjectURL) {
        throw new Error('Blob URL not supported');
      }

      var url = urlCreator.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      if (urlCreator.revokeObjectURL) {
        urlCreator.revokeObjectURL(url);
      }
    }

    function exportData() {
      var params;

      exportButton.disabled = true;
      exportButton.textContent = 'Preparing export...';
      exportNote.textContent = 'Collecting the CSV from the device.';

      params = fileSelect.value ? ('?file=' + encodeURIComponent(fileSelect.value)) : '';
      getBlob('/api/export.csv' + params, function (blob) {
        var selectedName = (fileSelect.value || currentLogFile || 'flow-history.csv').replace(/^\//, '');
        var fileName = selectedName || ('flow-history-' + Date.now() + '.csv');

        attemptNativeShare(blob, fileName, function () {
          exportNote.textContent = 'Shared from the device to your phone.';
          exportButton.disabled = false;
          exportButton.textContent = 'Export data to phone';
        }, function () {
          try {
            downloadBlob(blob, fileName);
            exportNote.textContent = 'CSV downloaded to this device.';
          } catch (e) {
            exportNote.textContent = 'Export failed. Browser blocks download on this device.';
          }
          exportButton.disabled = false;
          exportButton.textContent = 'Export data to phone';
        });
      }, function () {
        exportNote.textContent = 'Export failed. Try again while connected to the device AP.';
        exportButton.disabled = false;
        exportButton.textContent = 'Export data to phone';
      });
    }

    exportButton.addEventListener('click', exportData);
    fileSelect.addEventListener('change', pollHistory);
    window.addEventListener('resize', function () {
      drawChart(lastHistoryPoints);
    });
    setInterval(updateElapsedFromLastCurrent, 1000);
    setInterval(pollCurrent, CURRENT_POLL_MS);
    setInterval(pollHistory, HISTORY_POLL_MS);
    setInterval(pollFiles, FILES_POLL_MS);
    pollCurrent();
    pollHistory();
    pollFiles();
  </script>
</body>
</html>
